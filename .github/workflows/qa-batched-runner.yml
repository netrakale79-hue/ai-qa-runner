
name: QA Batched Runner

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Application URL to test"
        required: true
        type: string

      execution_id:
        description: "Unique QA execution ID"
        required: false
        type: string
        default: "manual-run"

      test_cases:
        description: "JSON string containing generated test cases"
        required: false
        type: string
        default: '{"test_cases":[]}'

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BASE_URL: ${{ inputs.target_url }}
      EXECUTION_ID: ${{ inputs.execution_id }}
      TEST_CASES_JSON: ${{ inputs.test_cases }}
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate input and test cases
        run: |
          node -e "
            const raw = process.env.TEST_CASES_JSON || '{\"test_cases\":[]}';
            const parsed = JSON.parse(raw);
            const cases = Array.isArray(parsed)
              ? parsed
              : parsed.test_cases;

            if (!Array.isArray(cases)) {
              throw new Error('Expected a test_cases array');
            }

            console.log('Execution ID:', process.env.EXECUTION_ID);
            console.log('Test cases received:', cases.length);
          "

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright test cases
        id: tests
        continue-on-error: true
        run: npx playwright test

      - name: Generate Allure HTML report
        if: always()
        shell: bash
        run: |
          if [ -d "allure-results" ] && \
             find allure-results -type f -print -quit | grep -q .; then
            npx allure generate allure-results \
              --clean -o allure-report
          else
            echo "No Allure results found; report was not generated."
          fi

      - name: Upload test results and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-results-${{ github.run_id }}
          path: |
            allure-results/
            allure-report/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Mark workflow as failed when tests fail
        if: steps.tests.outcome == 'failure'
        run: exit 1
